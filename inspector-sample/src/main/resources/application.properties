spring.application.name=inspector-sample
server.port=8081

spring.ai.model.chat=openai
spring.ai.model.embedding=none

# Docker Model Runner speaks the OpenAI API. When an Agent Inspector is running, the
# agent-inspector starter reroutes this base-url through its recording proxy at startup;
# otherwise the app talks to the model runner directly.
spring.ai.openai.api-key=${OPENAI_API_KEY:local-not-seeded}
spring.ai.openai.base-url=${LLM_URL:http://localhost:12434/engines/v1}
spring.ai.openai.chat.model=${LLM_MODEL:ai/qwen3:4b-instruct-2507-q4_K_M}
