spring.application.name=inspector-sample
server.port=8081

spring.ai.model.chat=openai
spring.ai.model.embedding=none

# Docker Model Runner speaks the OpenAI API. Instead of calling it directly
# (http://localhost:12434/engines/v1) the app goes through the inspector's "dmr" route,
# which forwards there and records every call. Nothing else in the app changes.
spring.ai.openai.api-key=${OPENAI_API_KEY:local-not-seeded}
spring.ai.openai.base-url=${LLM_URL:http://localhost:7070/proxy/dmr}
spring.ai.openai.chat.model=${LLM_MODEL:ai/qwen3:4b-instruct-2507-q4_K_M}
