<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Inspector</title>
    <link rel="stylesheet" href="css/inspector.css">
</head>
<body>
<header class="topbar">
    <h1>Agent Inspector</h1>
    <span class="live" id="live" title="Live updates">offline</span>
    <span class="muted" id="count"></span>
    <span class="spacer"></span>
    <button id="clear" type="button">Clear</button>
</header>
<main class="layout">
    <aside class="sidebar">
        <div class="list-tabs" role="tablist">
            <button type="button" role="tab" class="tab active" data-view="sessions">Sessions</button>
            <button type="button" role="tab" class="tab" data-view="calls">Calls</button>
        </div>
        <nav class="list" id="list" aria-label="Captured traffic"></nav>
    </aside>
    <section class="detail" id="detail">
        <div class="empty">
            <p>Nothing selected.</p>
            <p class="muted">Point an app's base-url at <code>http://localhost:7070/proxy/&lt;route&gt;</code>,
                e.g. <code>/proxy/dmr</code>, <code>/proxy/openai</code> or <code>/proxy/anthropic</code>.</p>
        </div>
    </section>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
