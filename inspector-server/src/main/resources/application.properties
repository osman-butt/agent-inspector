spring.application.name=agent-inspector

# Captured traffic contains prompts and tool results: listen on localhost only.
server.port=7070
server.address=127.0.0.1

# The proxy blocks while it waits for the model, so give every request its own virtual thread.
spring.threads.virtual.enabled=true

# Proxy routes: point an app's base-url at http://localhost:7070/proxy/<route>.
# The rest of the path is appended to the upstream URL.
agent.inspector.routes.openai=https://api.openai.com/v1
agent.inspector.routes.anthropic=https://api.anthropic.com
agent.inspector.routes.dmr=http://localhost:12434/engines/v1

agent.inspector.max-exchanges=500
agent.inspector.max-body-size=5MB
